<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreDes App</title>
  
  <!-- Telegram Web App SDK (এটি না থাকলে বটের ভেতরে অ্যাপ আটকে থাকে) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #fdf6e2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #000;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      padding-bottom: 80px;
    }

    /* Header Profile */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      background-color: #fca5a5;
      border: 2.5px solid #000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      box-shadow: 2px 2px 0px #000;
    }

    .user-details h3 {
      font-size: 16px;
      font-weight: 900;
    }

    .user-details p {
      font-size: 11px;
      color: #555;
      font-weight: bold;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      background: #fff;
      border: 2.5px solid #000;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 3px 3px 0px #000;
      font-weight: bold;
      cursor: pointer;
    }

    /* Neo-Brutalist Base Cards */
    .card {
      background-color: #fff;
      border: 3px solid #000;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 4px 4px 0px #000;
      margin-bottom: 16px;
    }

    .bg-yellow { background-color: #fcd535; }
    .bg-green { background-color: #84cc16; }
    .bg-pink { background-color: #f472b6; }
    .bg-cyan { background-color: #2dd4bf; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .tag-btn {
      background: #fff;
      border: 2px solid #000;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
      box-shadow: 2px 2px 0px #000;
      cursor: pointer;
    }

    .balance-val {
      font-size: 34px;
      font-weight: 900;
    }

    .balance-val span {
      font-size: 16px;
    }

    .sub-value {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    /* Action Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: 2.5px solid #000;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000;
      text-align: center;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    .btn-cyan { background-color: #2dd4bf; }
    .btn-white { background-color: #ffffff; }

    .section-title {
      font-size: 12px;
      font-weight: 900;
      margin: 16px 0 10px 0;
      letter-spacing: 0.5px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .grid-item {
      border: 2.5px solid #000;
      border-radius: 12px;
      padding: 14px 4px;
      text-align: center;
      font-size: 10px;
      font-weight: 900;
      box-shadow: 3px 3px 0px #000;
      cursor: pointer;
    }

    .market-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 2px solid #000;
    }

    .market-item:last-child {
      border-bottom: none;
    }

    .coin-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coin-icon {
      width: 32px;
      height: 32px;
      border: 2px solid #000;
      border-radius: 50%;
      background: #fcd535;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 12px;
    }

    .price-badge {
      background: #84cc16;
      border: 1.5px solid #000;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      box-shadow: 1.5px 1.5px 0px #000;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-top: 3px solid #000;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      box-shadow: 0 -4px 0px rgba(0,0,0,0.05);
    }

    .nav-item {
      text-align: center;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 8px;
    }

    .nav-item.active {
      background: #fcd535;
      border: 2px solid #000;
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="top-bar">
      <div class="profile-info">
        <div class="avatar" id="userAvatar">AA</div>
        <div class="user-details">
          <h3 id="userName">abdulaziz401</h3>
          <p>LV2 • MINER</p>
        </div>
      </div>
      <div class="icon-btn">🔔</div>
    </div>

    <div class="card bg-yellow">
      <div class="card-header">
        <span class="card-label">TOTAL BALANCE</span>
        <button class="tag-btn">HISTORY ></button>
      </div>
      <div class="balance-val" id="totalBalance">95,227 <span>PDS</span></div>
      <div class="sub-value">≈ $7.94</div>
      <div class="btn-row">
        <button class="btn btn-cyan" onclick="triggerAction('Exchange')">EXCHANGE</button>
        <button class="btn btn-white" onclick="triggerAction('Transfer')">TRANSFER</button>
      </div>
    </div>

    <div class="card bg-pink" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 18px;">
      <div>
        <div style="font-size: 10px; font-weight: 800;">DAILY REWARD READY</div>
        <div style="font-size: 11px; font-weight: bold; margin-top: 2px;">+1,000 PDS • day 10</div>
      </div>
      <button class="btn" style="background:#fcd535; padding: 6px 14px;" onclick="claimReward()">CLAIM</button>
    </div>

    <div class="section-title">QUICK ACTIONS</div>
    <div class="grid-4">
      <div class="grid-item bg-green" onclick="triggerAction('Mining')">MINING</div>
      <div class="grid-item bg-yellow" onclick="triggerAction('Boost')">BOOST</div>
      <div class="grid-item bg-pink" onclick="triggerAction('Tasks')">TASKS</div>
      <div class="grid-item bg-cyan" onclick="triggerAction('Exchange')">EXCHANGE</div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-label">MARKET</span>
        <button class="tag-btn">ALL MARKETS ></button>
      </div>
      
      <div class="market-item">
        <div class="coin-info">
          <div class="coin-icon">PDS</div>
          <div>
            <strong style="font-size: 12px;">PDS</strong>
            <div style="font-size: 10px; color: #666;">PreDes</div>
          </div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 12px; font-weight: bold;">$0.00008333</div>
          <span class="price-badge">+0.00%</span>
        </div>
      </div>

      <div class="market-item">
        <div class="coin-info">
          <div class="coin-icon" style="background: #f97316; color: #fff;">₿</div>
          <div>
            <strong style="font-size: 12px;">BTC</strong>
            <div style="font-size: 10px; color: #666;">Bitcoin</div>
          </div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 12px; font-weight: bold;">$76,863.98</div>
          <span class="price-badge">+1.56%</span>
        </div>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <div class="nav-item active">🏠<br>HOME</div>
    <div class="nav-item">⛏️<br>MINE</div>
    <div class="nav-item">📊<br>MARKETS</div>
    <div class="nav-item">🎯<br>TASKS</div>
    <div class="nav-item">👤<br>PROFILE</div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready(); // এটি টেলিগ্রামের সাদা স্ক্রিনের লোডিং বন্ধ করে
      tg.expand(); // এটি অ্যাপটিকে ফুল-স্ক্রিন করে

      // টেলিগ্রাম ইউজারনেম অটো সেট করার জন্য
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        document.getElementById('userName').innerText = user.username || user.first_name || 'User';
        document.getElementById('userAvatar').innerText = (user.first_name ? user.first_name[0] : 'U').toUpperCase();
      }
    }

    let balance = 95227;

    function claimReward() {
      balance += 1000;
      document.getElementById('totalBalance').innerHTML = balance.toLocaleString() + ' <span>PDS</span>';
      if (tg && tg.showAlert) {
        tg.showAlert('Congratulations! You claimed 1,000 PDS.');
      } else {
        alert('Congratulations! You claimed 1,000 PDS.');
      }
    }

    function triggerAction(actionName) {
      if (tg && tg.showAlert) {
        tg.showAlert(actionName + ' feature clicked!');
      } else {
        alert(actionName + ' feature clicked!');
      }
    }
  </script>
</body>
</html>
