<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADI$ Ultimate Admin Control Panel</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(23, 31, 45, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --accent: #38ef7d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: #fff; padding: 20px; display: flex; justify-content: center; }
    .admin-container { width: 100%; max-width: 1000px; }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2, h3 { color: #e2e8f0; margin-bottom: 15px; }

    input, select, textarea {
      width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px;
      background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
      border-radius: 8px; color: #fff; outline: none; font-size: 13px;
    }

    .btn {
      padding: 8px 14px; border-radius: 8px; border: none; font-weight: 700;
      cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--accent); color: #000; font-weight: 800; }
    .btn-approve { background: var(--green); color: #fff; }
    .btn-reject { background: var(--red); color: #fff; }
    .btn-ban { background: #b91c1c; color: #fff; }
    .btn-unban { background: #3b82f6; color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; }
    th { color: #9ca3af; text-transform: uppercase; font-size: 10px; }
    
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .badge-banned { background: rgba(239, 68, 68, 0.2); color: var(--red); }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--green); }

    .tab-nav { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 8px; color: #aaa; cursor: pointer; font-weight: 700; font-size: 12px; }
    .tab-btn.active { background: #e2e8f0; color: #0f172a; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
    #login-sec { max-width: 400px; margin: 100px auto; }
    #dashboard { display: none; }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <!-- LOGIN FORM -->
    <div id="login-sec" class="card">
      <h2 style="text-align: center;"><i class="fa-solid fa-shield-halved"></i> Admin Control</h2>
      <input type="password" id="adminPass" placeholder="Enter Admin Secret Key">
      <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="checkLogin()">Access Panel</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <h2><i class="fa-solid fa-sliders"></i> Master Command Center</h2>
        <button class="btn btn-reject" onclick="location.reload()">Logout</button>
      </div>

      <!-- Navigation Tabs -->
      <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('tab-users', this)">User & Balance Edit</button>
        <button class="tab-btn" onclick="switchTab('tab-settings', this)">App Config & Mining</button>
        <button class="tab-btn" onclick="switchTab('tab-tasks', this)">Tasks Review</button>
        <button class="tab-btn" onclick="switchTab('tab-add-task', this)">Add Task</button>
        <button class="tab-btn" onclick="switchTab('tab-broadcast', this)">Broadcast Notice</button>
      </div>

      <!-- TAB 1: USERS, BALANCE EDIT & BAN -->
      <div id="tab-users" class="tab-content active">
        <div class="card">
          <h3>User Management & Anti-Cheat Monitor</h3>
          <input type="text" id="userSearch" placeholder="Search Telegram ID / IP..." onkeyup="filterUsers()">
          <table>
            <thead>
              <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>IP / Device</th>
                <th>Balance</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB 2: SYSTEM CONFIG & MINING SPEED -->
      <div id="tab-settings" class="tab-content">
        <div class="card" style="max-width: 500px;">
          <h3>App Global Settings</h3>
          <label>Daily Reward (ADI$):</label>
          <input type="number" id="cfgDaily" placeholder="1000">

          <label>Mining Rate (Per Tap/Click):</label>
          <input type="number" id="cfgMine" placeholder="500">

          <label>Referral Bonus (Per Invite):</label>
          <input type="number" id="cfgRef" placeholder="2000">

          <button class="btn btn-primary" onclick="saveGlobalConfig()"><i class="fa-solid fa-floppy-disk"></i> Save Settings</button>
        </div>
      </div>

      <!-- TAB 3: PENDING TASKS -->
      <div id="tab-tasks" class="tab-content">
        <div class="card">
          <h3>Pending Task Approvals</h3>
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Task ID</th>
                <th>Reward</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB 4: ADD TASK -->
      <div id="tab-add-task" class="tab-content">
        <div class="card" style="max-width: 500px;">
          <h3>Add New Task</h3>
          <label>Title:</label><input type="text" id="newTaskTitle">
          <label>Reward Tokens:</label><input type="number" id="newTaskReward">
          <label>Link:</label><input type="text" id="newTaskLink">
          <button class="btn btn-primary" onclick="addNewTask()"><i class="fa-solid fa-plus"></i> Add Task</button>
        </div>
      </div>

      <!-- TAB 5: BROADCAST NOTICE -->
      <div id="tab-broadcast" class="tab-content">
        <div class="card" style="max-width: 500px;">
          <h3>Send Push Announcement</h3>
          <label>Notice Message (HTML Allowed):</label>
          <textarea id="broadcastMsg" rows="4" placeholder="Important Update: Mainnet Launch Soon!"></textarea>
          <button class="btn btn-primary" onclick="sendBroadcast()"><i class="fa-solid fa-paper-plane"></i> Publish Notice</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://ahs-shop-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const SECRET_PASSWORD = "admin1234password"; 

    function checkLogin() {
      if (document.getElementById('adminPass').value === SECRET_PASSWORD) {
        document.getElementById('login-sec').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        initAdmin();
      } else { alert("Wrong Key!"); }
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function initAdmin() {
      loadUsersAndCheckDuplicates();
      loadTasks();
      loadConfig();
    }

    // Auto Ban System & Multi-Account Detector
    function loadUsersAndCheckDuplicates() {
      database.ref('users').on('value', (snapshot) => {
        const users = snapshot.val();
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';

        const ipMap = {};

        // 1. Check IP Duplicates for Auto Ban
        for (let uId in users) {
          const user = users[uId];
          if (user.ipAddress) {
            if (!ipMap[user.ipAddress]) ipMap[user.ipAddress] = [];
            ipMap[user.ipAddress].push(uId);
          }
        }

        // Auto Ban Same IP Users
        for (let ip in ipMap) {
          if (ipMap[ip].length > 1) { // 1 টির বেশি একাউন্ট একই IP তে থাকলে অটো ব্যান
            ipMap[ip].forEach(uId => {
              if (!users[uId].isBanned) {
                database.ref('users/' + uId).update({ isBanned: true, banReason: "Multiple Account IP Detected" });
              }
            });
          }
        }

        // 2. Render Users Table
        for (let uId in users) {
          const u = users[uId];
          const row = document.createElement('tr');
          row.className = "user-row";
          row.setAttribute("data-search", `${uId} ${u.ipAddress || ''}`);
          row.innerHTML = `
            <td>${uId}</td>
            <td><strong>${u.username || 'User'}</strong></td>
            <td><small>${u.ipAddress || 'Unknown'}</small></td>
            <td>
              <strong style="color:var(--accent);">${(u.balance || 0).toLocaleString()}</strong>
              <button class="btn btn-primary" style="padding:2px 5px; font-size:10px;" onclick="editBalance('${uId}', ${u.balance || 0})"><i class="fa-solid fa-pen"></i></button>
            </td>
            <td><span class="badge ${u.isBanned ? 'badge-banned' : 'badge-active'}">${u.isBanned ? 'BANNED' : 'Active'}</span></td>
            <td>
              ${u.isBanned 
                ? `<button class="btn btn-unban" onclick="toggleBan('${uId}', false)">Unban</button>` 
                : `<button class="btn btn-ban" onclick="toggleBan('${uId}', true)">Ban</button>`}
            </td>
          `;
          tbody.appendChild(row);
        }
      });
    }

    // Manual Edit Balance
    function editBalance(userId, oldBal) {
      const newBal = prompt(`Edit Balance for User ${userId}:`, oldBal);
      if (newBal !== null) {
        database.ref('users/' + userId).update({ balance: Number(newBal) });
        alert('Balance Updated!');
      }
    }

    function toggleBan(userId, banStatus) {
      database.ref('users/' + userId).update({ isBanned: banStatus });
    }

    function filterUsers() {
      const q = document.getElementById('userSearch').value.toLowerCase();
      document.querySelectorAll('.user-row').forEach(row => {
        row.style.display = row.getAttribute('data-search').toLowerCase().includes(q) ? '' : 'none';
      });
    }

    // System Config
    function loadConfig() {
      database.ref('app_config').once('value', (snap) => {
        const c = snap.val() || {};
        document.getElementById('cfgDaily').value = c.dailyReward || 1000;
        document.getElementById('cfgMine').value = c.mineRate || 500;
        document.getElementById('cfgRef').value = c.refBonus || 2000;
      });
    }

    function saveGlobalConfig() {
      database.ref('app_config').set({
        dailyReward: Number(document.getElementById('cfgDaily').value),
        mineRate: Number(document.getElementById('cfgMine').value),
        refBonus: Number(document.getElementById('cfgRef').value)
      });
      alert('Global Settings Saved!');
    }

    // Broadcast Notice
    function sendBroadcast() {
      const msg = document.getElementById('broadcastMsg').value;
      if (!msg) return alert('Enter message!');
      database.ref('broadcast_notice').set({ message: msg, timestamp: Date.now() });
      alert('Notice Published to all Users!');
    }

    // Tasks & Approvals
    function addNewTask() {
      const title = document.getElementById('newTaskTitle').value;
      const reward = document.getElementById('newTaskReward').value;
      const link = document.getElementById('newTaskLink').value;
      if (!title || !reward || !link) return alert('Fill all fields!');

      database.ref('global_tasks/task_' + Date.now()).set({ title, reward: Number(reward), link });
      alert('Task Added!');
    }

    function loadTasks() {
      database.ref('users').on('value', (snapshot) => {
        const users = snapshot.val();
        const tbody = document.getElementById('taskTableBody');
        tbody.innerHTML = '';
        for (let uId in users) {
          if (users[uId].tasks) {
            for (let tId in users[uId].tasks) {
              const t = users[uId].tasks[tId];
              if (t.status === 'pending') {
                const row = document.createElement('tr');
                row.innerHTML = `
                  <td>${uId}</td>
                  <td>${tId}</td>
                  <td style="color:var(--green);">+${t.reward}</td>
                  <td>
                    <button class="btn btn-approve" onclick="approveTask('${uId}', '${tId}', ${t.reward}, ${users[uId].balance || 0})">Approve</button>
                  </td>
                `;
                tbody.appendChild(row);
              }
            }
          }
        }
      });
    }

    function approveTask(uId, tId, reward, curBal) {
      database.ref('users/' + uId).update({ balance: Number(curBal) + Number(reward) });
      database.ref('users/' + uId + '/tasks/' + tId).update({ status: 'approved' });
    }
  </script>
</body>
  </html>
